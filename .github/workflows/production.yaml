name: Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - prod-apk
          - prod-aab
          - all

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Skip CI check
        run: echo "Proceeding with production workflow"

  test:
    needs: check-skip
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --omit=optional --ignore-scripts || npm install --omit=optional

      - name: 🧪 Run TypeScript check
        run: npm run tsc --if-present || npx tsc --noEmit

      - name: 🧹 Run ESLint
        run: npm run lint

      - name: 🎨 Run Prettier check
        run: npm run format:check --if-present || npx prettier --check .

  build-production:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove unnecessary packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

          # Remove Docker images and containers
          docker rmi $(docker images -q) -f || true
          docker system prune -af || true

          echo "Disk space after cleanup:"
          df -h

      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📱 Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: 📦 Install Android NDK
        run: |
          echo "Installing NDK..."
          sdkmanager --install "ndk;27.3.13750724"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: 📦 Install dependencies
        run: |
          npm ci --omit=optional --ignore-scripts || npm install --omit=optional
          npm install -g eas-cli@latest

      - name: 📱 Setup EAS build cache
        uses: actions/cache@v3
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-production-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-eas-build-local-production-
            ${{ runner.os }}-eas-build-local-

      - name: 🔄 Verify EAS CLI installation
        run: |
          echo "EAS CLI version:"
          eas --version

      - name: 📋 Verify config files
        run: |
          echo "Verifying configuration files..."

          # Check package.json
          if [ -f ./package.json ]; then
            echo "✓ package.json exists"
            echo "Main entry: $(cat package.json | grep '"main"')"
          else
            echo "✗ package.json not found"
            exit 1
          fi

          # Check app.config.js
          if [ -f ./app.config.js ]; then
            echo "✓ app.config.js exists"
            echo "First 3 lines:"
            head -3 app.config.js
          else
            echo "✗ app.config.js not found"
            exit 1
          fi

          # Check metro.config.js
          if [ -f ./metro.config.js ]; then
            echo "✓ metro.config.js exists"
            echo "First 3 lines:"
            head -3 metro.config.js
          else
            echo "✗ metro.config.js not found"
            exit 1
          fi

      - name: 🧹 Clean Metro cache before build
        run: |
          rm -rf node_modules/.cache
          rm -rf /tmp/metro-*
          rm -rf $HOME/.expo

      - name: 🔧 Create production environment file
        run: |
          echo "Creating .env.production.build..."

          # Create env file with proper formatting (no heredoc to avoid whitespace issues)
          echo "SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL || secrets.SUPABASE_URL }}" > .env.production.build
          echo "SUPABASE_KEY=${{ secrets.PROD_SUPABASE_KEY || secrets.SUPABASE_KEY }}" >> .env.production.build
          echo "GOOGLE_VISION_API_KEY=${{ secrets.PROD_GOOGLE_VISION_API_KEY || secrets.GOOGLE_VISION_API_KEY }}" >> .env.production.build
          echo "SITE_URL=${{ secrets.PROD_SITE_URL || secrets.SITE_URL }}" >> .env.production.build
          echo "ONESIGNAL_APP_ID=${{ secrets.PROD_ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID }}" >> .env.production.build
          echo "SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN || secrets.SENTRY_DSN }}" >> .env.production.build
          echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}" >> .env.production.build
          echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}" >> .env.production.build
          echo "POSTHOG_API_KEY=${{ secrets.PROD_POSTHOG_API_KEY || secrets.POSTHOG_API_KEY }}" >> .env.production.build
          echo "POSTHOG_HOST=${{ secrets.PROD_POSTHOG_HOST || secrets.POSTHOG_HOST }}" >> .env.production.build
          echo "NODE_ENV=production" >> .env.production.build

          echo "✓ Created. Verifying contents..."
          echo "--- .env.production.build contents (keys only, values masked) ---"
          while IFS='=' read -r key value; do
            if [ -n "$value" ]; then
              echo "✓ $key is set"
            else
              echo "⚠ $key is EMPTY - this may cause issues!"
            fi
          done < .env.production.build
          echo "--------------------------------------"

          # Verify critical variables are not empty
          if ! grep -q "SUPABASE_URL=http" .env.production.build; then
            echo "⚠ WARNING: SUPABASE_URL may not be set correctly!"
          fi

      - name: 🔧 Create Sentry properties files
        run: |
          echo "Creating sentry.properties for Android and iOS..."

          for DIR in android ios; do
            echo "auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}" > "$DIR/sentry.properties"
            echo "defaults.org=${{ secrets.SENTRY_ORG }}" >> "$DIR/sentry.properties"
            echo "defaults.project=${{ secrets.SENTRY_PROJECT }}" >> "$DIR/sentry.properties"
            echo "defaults.url=https://sentry.io/" >> "$DIR/sentry.properties"
            echo "✓ Created $DIR/sentry.properties"
          done

      - name: 📱 Build Production APK
        if: github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'prod-apk' || (github.event_name == 'push' && (github.event.inputs.buildType == '' || github.event.inputs.buildType == null))
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export EXPO_NO_METRO_LAZY=1
          export EAS_SKIP_AUTO_FINGERPRINT=1

          echo "Starting production APK build..."
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "EAS CLI version: $(eas --version)"

          eas build --platform android --profile production-apk --local --non-interactive --output=./app-prod.apk 2>&1 | tee build.log

          # Check if build failed
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Build failed. Last 100 lines of output:"
            tail -100 build.log
            exit 1
          fi

          # Verify the build output
          if [ -f "./app-prod.apk" ]; then
            echo "✓ Production APK built successfully"
            ls -lh ./app-prod.apk
          else
            echo "✗ Production APK not found at expected location"
            echo "Searching for APK files..."
            find . -name "*.apk" -type f -mmin -30 | head -20

            # Try to find and copy the APK
            APK_FILE=$(find . -name "*.apk" -type f -mmin -30 | grep -E "(app-release|production)" | head -1)
            if [ -n "$APK_FILE" ]; then
              echo "Found APK at: $APK_FILE"
              cp "$APK_FILE" ./app-prod.apk
              echo "✓ Copied APK to ./app-prod.apk"
            else
              echo "✗ Could not find any APK file"
              exit 1
            fi
          fi

      - name: 🧹 Remove environment file
        if: always()
        run: |
          if [ -f .env.production.build ]; then rm .env.production.build && echo "✓ Cleaned up"; else echo "✓ No cleanup needed"; fi

      - name: 🧹 Clean up after prod APK build
        if: github.event.inputs.buildType == 'all'
        run: |
          echo "Cleaning up temporary build files..."
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf node_modules/.cache
          df -h

      - name: 🔧 Create production environment file for AAB
        if: github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'prod-aab'
        run: |
          echo "Creating .env.production.build..."

          # Create env file with proper formatting (no heredoc to avoid whitespace issues)
          echo "SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL || secrets.SUPABASE_URL }}" > .env.production.build
          echo "SUPABASE_KEY=${{ secrets.PROD_SUPABASE_KEY || secrets.SUPABASE_KEY }}" >> .env.production.build
          echo "GOOGLE_VISION_API_KEY=${{ secrets.PROD_GOOGLE_VISION_API_KEY || secrets.GOOGLE_VISION_API_KEY }}" >> .env.production.build
          echo "SITE_URL=${{ secrets.PROD_SITE_URL || secrets.SITE_URL }}" >> .env.production.build
          echo "ONESIGNAL_APP_ID=${{ secrets.PROD_ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID }}" >> .env.production.build
          echo "SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN || secrets.SENTRY_DSN }}" >> .env.production.build
          echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}" >> .env.production.build
          echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}" >> .env.production.build
          echo "POSTHOG_API_KEY=${{ secrets.PROD_POSTHOG_API_KEY || secrets.POSTHOG_API_KEY }}" >> .env.production.build
          echo "POSTHOG_HOST=${{ secrets.PROD_POSTHOG_HOST || secrets.POSTHOG_HOST }}" >> .env.production.build
          echo "NODE_ENV=production" >> .env.production.build

          echo "✓ Created. Verifying contents..."
          echo "--- .env.production.build contents (keys only, values masked) ---"
          while IFS='=' read -r key value; do
            if [ -n "$value" ]; then
              echo "✓ $key is set"
            else
              echo "⚠ $key is EMPTY - this may cause issues!"
            fi
          done < .env.production.build
          echo "--------------------------------------"

      - name: 📱 Build Production AAB
        if: github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'prod-aab'
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export EXPO_NO_METRO_LAZY=1
          export EAS_SKIP_AUTO_FINGERPRINT=1

          echo "Starting production AAB build..."
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "EAS CLI version: $(eas --version)"

          eas build --platform android --profile production --local --non-interactive --output=./app-prod.aab 2>&1 | tee build-aab.log

          # Check if build failed
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Build failed. Last 100 lines of output:"
            tail -100 build-aab.log
            exit 1
          fi

          # Verify the build output
          if [ -f "./app-prod.aab" ]; then
            echo "✓ Production AAB built successfully"
            ls -lh ./app-prod.aab
          else
            echo "✗ Production AAB not found at expected location"
            echo "Searching for AAB files..."
            find . -name "*.aab" -type f -mmin -30 | head -20

            # Try to find and copy the AAB
            AAB_FILE=$(find . -name "*.aab" -type f -mmin -30 | grep -E "(app-release|production)" | head -1)
            if [ -n "$AAB_FILE" ]; then
              echo "Found AAB at: $AAB_FILE"
              cp "$AAB_FILE" ./app-prod.aab
              echo "✓ Copied AAB to ./app-prod.aab"
            else
              echo "✗ Could not find any AAB file"
              exit 1
            fi
          fi

      - name: 🧹 Remove environment file after AAB
        if: always()
        run: |
          if [ -f .env.production.build ]; then rm .env.production.build && echo "✓ Cleaned up"; else echo "✓ No cleanup needed"; fi

      - name: 📋 List build artifacts
        run: |
          echo "=== Build artifacts in current directory ==="
          ls -lh *.apk *.aab 2>/dev/null || echo "No APK/AAB files in root"
          echo ""
          echo "=== Verifying expected files ==="
          if [ -f "./app-prod.apk" ]; then
            echo "✓ app-prod.apk exists ($(du -h ./app-prod.apk | cut -f1))"
          else
            echo "✗ app-prod.apk not found"
          fi
          if [ -f "./app-prod.aab" ]; then
            echo "✓ app-prod.aab exists ($(du -h ./app-prod.aab | cut -f1))"
          else
            echo "✗ app-prod.aab not found"
          fi

      - name: 📦 Upload build artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: production-builds-${{ github.sha }}
          path: |
            ./app-prod.apk
            ./app-prod.aab
          retention-days: 30
          if-no-files-found: warn

      - name: 📢 Build Summary
        run: |
          echo "## 🚀 Production Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ github.event.inputs.buildType || 'default (prod-apk)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "./app-prod.apk" ]; then
            APK_SIZE=$(du -h ./app-prod.apk | cut -f1)
            echo "✅ **Production APK:** app-prod.apk ($APK_SIZE)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "./app-prod.aab" ]; then
            AAB_SIZE=$(du -h ./app-prod.aab | cut -f1)
            echo "✅ **Production AAB:** app-prod.aab ($AAB_SIZE)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build artifacts are available in the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** Production builds are retained for 30 days." >> $GITHUB_STEP_SUMMARY
