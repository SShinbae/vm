name: iOS Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Skip CI check
        run: echo "Proceeding with iOS production workflow"

  build-ios-production:
    needs: check-skip
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 🛠 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: 📦 Install CocoaPods
        run: |
          gem install cocoapods -N
          pod --version

      - name: 📦 Install dependencies
        run: |
          npm ci --omit=optional --ignore-scripts || npm install --omit=optional
          npm install -g eas-cli@latest

      - name: 📱 Setup EAS build cache
        uses: actions/cache@v3
        with:
          path: ~/.eas-build-local
          key: ${{ runner.os }}-eas-build-local-ios-production-${{ hashFiles('**/package.json', 'ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-eas-build-local-ios-production-
            ${{ runner.os }}-eas-build-local-ios-

      - name: 🔄 Verify EAS CLI installation
        run: |
          echo "EAS CLI version:"
          eas --version

      - name: 📋 Verify config files
        run: |
          echo "Verifying configuration files..."
          for f in package.json app.config.js metro.config.js eas.json; do
            if [ -f "./$f" ]; then
              echo "✓ $f exists"
            else
              echo "✗ $f not found"
              exit 1
            fi
          done

      - name: 🧹 Clean Metro cache before build
        run: |
          rm -rf node_modules/.cache
          rm -rf /tmp/metro-*
          rm -rf $HOME/.expo

      - name: 🔧 Create production environment file
        run: |
          echo "Creating .env.production.build..."
          echo "SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL || secrets.SUPABASE_URL }}" > .env.production.build
          echo "SUPABASE_KEY=${{ secrets.PROD_SUPABASE_KEY || secrets.SUPABASE_KEY }}" >> .env.production.build
          echo "GOOGLE_VISION_API_KEY=${{ secrets.PROD_GOOGLE_VISION_API_KEY || secrets.GOOGLE_VISION_API_KEY }}" >> .env.production.build
          echo "SITE_URL=${{ secrets.PROD_SITE_URL || secrets.SITE_URL }}" >> .env.production.build
          echo "ONESIGNAL_APP_ID=${{ secrets.PROD_ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID }}" >> .env.production.build
          echo "SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN || secrets.SENTRY_DSN }}" >> .env.production.build
          echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}" >> .env.production.build
          echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}" >> .env.production.build
          echo "POSTHOG_API_KEY=${{ secrets.PROD_POSTHOG_API_KEY || secrets.POSTHOG_API_KEY }}" >> .env.production.build
          echo "POSTHOG_HOST=${{ secrets.PROD_POSTHOG_HOST || secrets.POSTHOG_HOST }}" >> .env.production.build
          echo "NODE_ENV=production" >> .env.production.build

          echo "✓ Created. Verifying contents..."
          while IFS='=' read -r key value; do
            if [ -n "$value" ]; then
              echo "✓ $key is set"
            else
              echo "⚠ $key is EMPTY - this may cause issues!"
            fi
          done < .env.production.build

      - name: 🔧 Create Sentry properties files
        run: |
          mkdir -p android ios
          for DIR in android ios; do
            echo "auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}" > "$DIR/sentry.properties"
            echo "defaults.org=${{ secrets.SENTRY_ORG }}" >> "$DIR/sentry.properties"
            echo "defaults.project=${{ secrets.SENTRY_PROJECT }}" >> "$DIR/sentry.properties"
            echo "defaults.url=https://sentry.io/" >> "$DIR/sentry.properties"
            echo "✓ Created $DIR/sentry.properties"
          done

      - name: 🔐 Decode iOS signing assets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_DIST_CERT_P12_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "✗ Missing IOS_DIST_CERT_P12_BASE64 or IOS_PROVISIONING_PROFILE_BASE64 secret"
            exit 1
          fi
          mkdir -p ios/certs
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > ios/certs/dist.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ios/certs/profile.mobileprovision
          echo "✓ Decoded signing assets ($(wc -c < ios/certs/dist.p12) bytes cert, $(wc -c < ios/certs/profile.mobileprovision) bytes profile)"

      - name: 🔐 Import signing cert into temp keychain
        env:
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import ios/certs/dist.p12 -k "$KEYCHAIN_PATH" \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"' | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          echo "✓ Cert imported into temp keychain"

      - name: 🔐 Install provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          UUID=$(security cms -D -i ios/certs/profile.mobileprovision \
            | plutil -extract UUID xml1 -o - - \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          if [ -z "$UUID" ]; then
            echo "✗ Could not extract UUID from provisioning profile"
            exit 1
          fi
          cp ios/certs/profile.mobileprovision "$PROFILE_DIR/$UUID.mobileprovision"
          echo "✓ Installed provisioning profile $UUID"

      - name: 🔧 Write credentials.json
        env:
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          # Use jq for safe JSON escaping of the password
          jq -n \
            --arg password "$IOS_DIST_CERT_PASSWORD" \
            '{ios:{provisioningProfilePath:"ios/certs/profile.mobileprovision",distributionCertificate:{path:"ios/certs/dist.p12",password:$password}}}' \
            > credentials.json
          echo "✓ credentials.json written"

      - name: 📱 Build Production IPA
        run: |
          export NODE_OPTIONS="--max-old-space-size=6144"
          export EXPO_NO_METRO_LAZY=1
          export EAS_SKIP_AUTO_FINGERPRINT=1
          export SENTRY_DISABLE_AUTO_UPLOAD=true
          # Override .npmrc optional=false so EAS's internal `npx eas-cli-local-build-plugin`
          # installs platform-specific binaries (e.g. @ngrok/ngrok-darwin-*, required by EAS CLI v20+).
          export npm_config_optional=true

          echo "Starting production IPA build..."
          eas build --platform ios --profile production --local --non-interactive --output=./app-prod.ipa 2>&1 | tee build-ios.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Build failed. Tail of build log:"
            tail -500 build-ios.log
            grep -i "error\|exception\|failure\|FAILED" build-ios.log | tail -50 || true
            exit 1
          fi

          if [ -f "./app-prod.ipa" ]; then
            echo "✓ Production IPA built successfully ($(du -h ./app-prod.ipa | cut -f1))"
          else
            echo "✗ IPA not found at expected location"
            find . -name "*.ipa" -type f -mmin -30 | head -20
            IPA_FILE=$(find . -name "*.ipa" -type f -mmin -30 | head -1)
            if [ -n "$IPA_FILE" ]; then
              cp "$IPA_FILE" ./app-prod.ipa
              echo "✓ Copied IPA to ./app-prod.ipa"
            else
              exit 1
            fi
          fi

      - name: 📦 Upload build artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ios-production-builds-${{ github.sha }}
          path: ./app-prod.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 🧹 Cleanup signing assets
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf ios/certs credentials.json .env.production.build
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
          echo "✓ Cleaned up signing assets"

      - name: 📢 Build Summary
        if: success()
        run: |
          echo "## 🍎 iOS Production Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "./app-prod.ipa" ]; then
            IPA_SIZE=$(du -h ./app-prod.ipa | cut -f1)
            echo "✅ **Production IPA:** app-prod.ipa ($IPA_SIZE)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Distribution" >> $GITHUB_STEP_SUMMARY
          echo "Download the IPA from the **Artifacts** section, then upload to https://betadrop.app to share with registered test devices." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** Artifacts retained for 30 days." >> $GITHUB_STEP_SUMMARY
