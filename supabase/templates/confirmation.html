<!DOCTYPE html>
<html>
  <body style="margin:0;padding:24px;background:#f4f5f7;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr><td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
          <tr><td style="font-size:20px;font-weight:700;color:#111827;">Vehicles Management</td></tr>
          <tr><td style="padding-top:24px;font-size:22px;font-weight:700;color:#111827;">Confirm your email</td></tr>
          <tr><td style="padding-top:12px;font-size:15px;line-height:22px;color:#4b5563;">Thanks for signing up. Tap the button below to verify your email address.</td></tr>
          <tr><td style="padding-top:24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup" style="display:inline-block;background:#4338ca;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 24px;border-radius:8px;">Confirm email</a>
          </td></tr>
          <tr><td style="padding-top:24px;font-size:13px;color:#6b7280;">Or enter this code: <strong style="color:#111827;letter-spacing:2px;">{{ .Token }}</strong></td></tr>
          <tr><td style="padding-top:24px;font-size:12px;color:#9ca3af;">If you did not create an account, ignore this email.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
